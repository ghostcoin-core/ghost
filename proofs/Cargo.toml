[package]
name = "ghost-proofs"
version = "0.1.0"
description = "The one-time reveal and proof-of-holding statements of Ghost, with a native prover and verifier"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# The static library carries the C interface of src/ffi.rs for a node to link.
crate-type = ["rlib", "staticlib"]

# Its own workspace: the benchmark harness is a separate one and nothing here
# depends on it.
[workspace]

[features]
default = []
# Multi-threaded proving through Plonky3's rayon wrapper. Off by default.
parallel = ["p3-maybe-rayon/parallel", "p3-uni-stark/parallel"]
# Builds the test-only prover of the proof of holding (prove_salted_hold, its
# claiming variants for lying-prover tests, test_absence_witness) and the
# test-only verifiers beside it. It covers the proof of holding only: the
# data reveal is built and verified without it. The public verify_hold
# verifies a proof of holding whether or not it is on.
unsettled-points-test = []

# Every Plonky3 crate is pinned to the revision of decision 0003.
[dependencies]
p3-air = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-keccak = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-keccak-air = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-maybe-rayon = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-uni-stark = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }

[profile.release]
opt-level = 3
codegen-units = 1

[profile.test]
opt-level = 3
