[package]
name = "ghost-reveal-bench"
version = "0.1.0"
description = "The real coin reveal prover of ghost-proofs, built for a browser worker, and a native check of the proofs it makes"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

# Its own workspace, apart from the harness workspace one level up: it builds
# the real statement from ../../proofs, whose Plonky3 pins and lock file it
# shares, and needs no WebAssembly bindings generator.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ghost-proofs = { path = "../../proofs" }

# For tests/recursion_proxy.rs: the pinned Plonky3 crates of proofs/Cargo.toml,
# at the same revision, and its postcard and rand.
[dev-dependencies]
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-keccak = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-keccak-air = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
p3-uni-stark = { git = "https://github.com/Plonky3/Plonky3", rev = "f98331687e47106a64ab82a77e2e1d0d66c9161b" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }

[profile.release]
opt-level = 3
codegen-units = 1

[profile.test]
opt-level = 3
