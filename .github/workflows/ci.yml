name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  # Only a newer push to the same pull request cancels a run. Runs on main
  # always finish, so every merge gets a full result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job runs one step of scripts/ci-gate.sh, so CI and a local run of
# that script use the same commands.
jobs:
  required-files:
    name: required-files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: scripts/ci-gate.sh required-files

  markdown-lint:
    name: markdown-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: scripts/ci-gate.sh markdown-lint

  shell-lint:
    name: shell-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: scripts/ci-gate.sh shell-lint

  # One job per Rust crate: release tests, then a library check for the
  # browser target. Both run on the GitHub-hosted image like the jobs above:
  # this repository is public, and public repositories never get the
  # self-hosted runners. The toolchain is pinned to an exact version, and
  # RUSTUP_TOOLCHAIN hands that same version to the script.
  #
  # The proofs crate is split across parallel jobs so each fits its
  # 10-minute limit: rust-proofs runs the library, doc and integration tests
  # except the recursion layers and the ML-DSA chunk proofs (built with the
  # parallel feature), then the wasm32 check; the rust-proofs-layers-* jobs
  # run the recursion layer tests (proofs/tests/layers*.rs); the
  # rust-proofs-mldsa* jobs run the ML-DSA chunk proof tests
  # (proofs/tests/mldsa_chunk.rs). Together they run the same tests as the
  # rust-proofs step of scripts/ci-gate.sh.
  rust-proofs:
    name: rust-proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            proofs/target
          # "parallel" in the key: these tests build with the parallel
          # feature, so a cache saved by a build without it is not reused.
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-proofs-parallel-${{ hashFiles('proofs/Cargo.lock') }}
      # Every file in proofs/tests/ except layers.rs, layers_*.rs and
      # mldsa_chunk.rs, so a new test file runs here without editing this
      # list. mldsa_chunk_bench.rs stays here: its benchmark is #[ignore] and
      # runs only by hand with -- --ignored --nocapture.
      # The tests build with the parallel feature, as the rust-proofs-mldsa*
      # jobs do: proving is single-threaded without it, and single-threaded
      # this step ran within a minute of the 10-minute limit. The doc tests
      # take the same feature so they reuse that build of the library.
      - name: Test (release, all but the recursion layers and ML-DSA chunks)
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: |
          set -euo pipefail
          tests=()
          for f in proofs/tests/*.rs; do
            name="$(basename "$f" .rs)"
            case "$name" in
              layers | layers_* | mldsa_chunk) ;;
              *) tests+=(--test "$name") ;;
            esac
          done
          echo "integration tests: ${tests[*]}"
          cargo test --release --locked --features parallel --manifest-path proofs/Cargo.toml --lib "${tests[@]}"
          cargo test --release --locked --features parallel --manifest-path proofs/Cargo.toml --doc
      - name: Check wasm32-unknown-unknown
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo check --locked --manifest-path proofs/Cargo.toml --lib --target wasm32-unknown-unknown

  rust-proofs-layers-reveal:
    name: rust-proofs-layers-reveal
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      # Its own cache key apart from rust-proofs: the layers jobs build the
      # same test binaries, so they share this key with each other.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            proofs/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-proofs-layers-${{ hashFiles('proofs/*.lock') }}
      # One slow layers test per job so each fits the 10-minute limit.
      - name: Test (release) the recursion layers
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --release --locked --manifest-path proofs/Cargo.toml --test layers -- --exact a_bundle_of_one_real_reveal_verifies

  rust-proofs-layers-pipeline:
    name: rust-proofs-layers-pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      # Its own cache key apart from rust-proofs: the layers jobs build the
      # same test binaries, so they share this key with each other.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            proofs/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-proofs-layers-${{ hashFiles('proofs/*.lock') }}
      # One slow layers test per job so each fits the 10-minute limit.
      - name: Test (release) the recursion layers
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --release --locked --manifest-path proofs/Cargo.toml --test layers -- --exact a_root_and_a_shrink_prove_an_aggregators_batches

  rust-proofs-layers-shrink:
    name: rust-proofs-layers-shrink
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      # Its own cache key apart from rust-proofs: the layers jobs build the
      # same test binaries, so they share this key with each other.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            proofs/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-proofs-layers-${{ hashFiles('proofs/*.lock') }}
      # One slow layers test per job so each fits the 10-minute limit.
      - name: Test (release) the recursion layers
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --release --locked --manifest-path proofs/Cargo.toml --test layers -- --exact the_real_shrink_fits_the_proof_field

  rust-proofs-layers-bundle32:
    name: rust-proofs-layers-bundle32
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      # Its own cache key apart from rust-proofs: the layers jobs build the
      # same test binaries, so they share this key with each other.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            proofs/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-proofs-layers-${{ hashFiles('proofs/*.lock') }}
      # One slow layers test per job so each fits the 10-minute limit.
      - name: Test (release) the recursion layers
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --release --locked --manifest-path proofs/Cargo.toml --test layers -- --exact a_bundle_of_32_verifies_and_its_contents_are_fixed

  rust-proofs-layers-rest:
    name: rust-proofs-layers-rest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      # Its own cache key apart from rust-proofs: the layers jobs build the
      # same test binaries, so they share this key with each other.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            proofs/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-proofs-layers-${{ hashFiles('proofs/*.lock') }}
      # Every other layers test, plus layers_results and layers_bench (its
      # benchmark is #[ignore] and runs only by hand with -- --ignored
      # --nocapture). The skipped tests each run in their own job above.
      - name: Test (release) the recursion layers
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --release --locked --manifest-path proofs/Cargo.toml --test layers --test layers_results --test layers_bench -- --exact --skip a_bundle_of_one_real_reveal_verifies --skip a_root_and_a_shrink_prove_an_aggregators_batches --skip the_real_shrink_fits_the_proof_field --skip a_bundle_of_32_verifies_and_its_contents_are_fixed

  # The ML-DSA chunk proof tests (proofs/tests/mldsa_chunk.rs), one slow
  # test per job so each fits the 10-minute limit, every other test in
  # rust-proofs-mldsa-rest. They build with the parallel feature: proving
  # is single-threaded without it, and a single-threaded fold does not fit
  # 10 minutes on a hosted runner.
  rust-proofs-mldsa-kat:
    name: rust-proofs-mldsa-kat
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      # Its own cache key apart from rust-proofs and the layers jobs: the
      # mldsa jobs build the same test binary, so they share this key with
      # each other.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            proofs/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-proofs-mldsa-parallel-${{ hashFiles('proofs/*.lock') }}
      # One slow ML-DSA chunk test per job.
      - name: Test (release) the ML-DSA chunk proofs
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --release --locked --features parallel --manifest-path proofs/Cargo.toml --test mldsa_chunk -- --exact the_known_answer_vectors_pass_inside_the_chunk_proof

  rust-proofs-mldsa-refuse:
    name: rust-proofs-mldsa-refuse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      # Its own cache key apart from rust-proofs and the layers jobs: the
      # mldsa jobs build the same test binary, so they share this key with
      # each other.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            proofs/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-proofs-mldsa-parallel-${{ hashFiles('proofs/*.lock') }}
      # One slow ML-DSA chunk test per job.
      - name: Test (release) the ML-DSA chunk proofs
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --release --locked --features parallel --manifest-path proofs/Cargo.toml --test mldsa_chunk -- --exact a_chunk_verifies_valid_signatures_and_refuses_any_change

  rust-proofs-mldsa-reorder:
    name: rust-proofs-mldsa-reorder
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      # Its own cache key apart from rust-proofs and the layers jobs: the
      # mldsa jobs build the same test binary, so they share this key with
      # each other.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            proofs/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-proofs-mldsa-parallel-${{ hashFiles('proofs/*.lock') }}
      # One slow ML-DSA chunk test per job.
      - name: Test (release) the ML-DSA chunk proofs
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --release --locked --features parallel --manifest-path proofs/Cargo.toml --test mldsa_chunk -- --exact reordered_added_or_dropped_transactions_fail

  rust-proofs-mldsa-fold:
    name: rust-proofs-mldsa-fold
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
      # Plonky3 packs BabyBear and Poseidon2 eight lanes wide only when AVX2
      # is enabled at compile time; without it the fold proves scalar and
      # takes about the whole 10 minutes. Every hosted x86 runner has AVX2.
      # The flag changes only how fast the same proofs are made.
      RUSTFLAGS: -C target-feature=+avx2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      # Its own cache key apart from the other mldsa jobs: RUSTFLAGS changes
      # every build artifact. rust-proofs-mldsa-fold and
      # rust-proofs-mldsa-shrink build the same AVX2 test binary, so they
      # share this key with each other.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            proofs/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-proofs-mldsa-parallel-avx2-${{ hashFiles('proofs/*.lock') }}
      # One slow ML-DSA chunk test per job: the batch and root of the fold.
      # Their shrink runs in rust-proofs-mldsa-shrink, which proves the
      # batches and root again, so neither job carries the whole fold.
      - name: Test (release) the ML-DSA chunk proofs
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --release --locked --features parallel --manifest-path proofs/Cargo.toml --test mldsa_chunk -- --exact chunks_batch_and_root_fold_correctly

  rust-proofs-mldsa-shrink:
    name: rust-proofs-mldsa-shrink
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
      # AVX2 packing, as in rust-proofs-mldsa-fold: this job proves the
      # batches and root again before the shrink, and that only fits well
      # under 10 minutes with the packed field and Poseidon2.
      RUSTFLAGS: -C target-feature=+avx2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      # The AVX2 cache key it shares with rust-proofs-mldsa-fold.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            proofs/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-proofs-mldsa-parallel-avx2-${{ hashFiles('proofs/*.lock') }}
      # One slow ML-DSA chunk test per job: the shrink of the fold's root to
      # the public root proof's size. It proves the batches and root again
      # rather than take them from rust-proofs-mldsa-fold.
      - name: Test (release) the ML-DSA chunk proofs
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --release --locked --features parallel --manifest-path proofs/Cargo.toml --test mldsa_chunk -- --exact chunks_shrink_folds_to_the_public_root_size

  rust-proofs-mldsa-rest:
    name: rust-proofs-mldsa-rest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      # Its own cache key apart from rust-proofs and the layers jobs: the
      # mldsa jobs build the same test binary, so they share this key with
      # each other.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            proofs/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-proofs-mldsa-parallel-${{ hashFiles('proofs/*.lock') }}
      # Every other ML-DSA chunk test; the skipped ones each run in their own job above.
      - name: Test (release) the ML-DSA chunk proofs
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --release --locked --features parallel --manifest-path proofs/Cargo.toml --test mldsa_chunk -- --exact --skip the_known_answer_vectors_pass_inside_the_chunk_proof --skip a_chunk_verifies_valid_signatures_and_refuses_any_change --skip reordered_added_or_dropped_transactions_fail --skip chunks_batch_and_root_fold_correctly --skip chunks_shrink_folds_to_the_public_root_size

  # The production root keys (proofs/tests/production_root_keys.rs), derived
  # again after every merge to main and checked against the bytes and digests
  # committed in proofs/keys/. Deriving a key takes minutes, so these run
  # only on a push to main, never on a pull request, one key a job so each
  # fits the 10-minute limit: rust-proofs-root-key-bundle runs every ignored
  # test of the file but the public root's derivation, which runs in
  # rust-proofs-root-key-public. A change that alters a key without
  # committing its new bytes and digest turns main red here.
  # scripts/check-production-root-keys-job.sh checks these jobs.
  rust-proofs-root-key-bundle:
    name: rust-proofs-root-key-bundle
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      # Its own cache key: the two root key jobs build the same test binary,
      # so they share this key with each other.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            proofs/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-proofs-root-keys-parallel-${{ hashFiles('proofs/*.lock') }}
      # The parallel feature spreads Plonky3's transforms and hashing over
      # every core. They are exact field arithmetic, so it changes only how
      # fast the same key is derived.
      - name: Derive the bundle root key (release, ignored tests)
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --release --locked --features parallel --manifest-path proofs/Cargo.toml --test production_root_keys -- --ignored --nocapture --exact --skip derive_production_public_root_key

  rust-proofs-root-key-public:
    name: rust-proofs-root-key-public
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      # The cache key it shares with rust-proofs-root-key-bundle.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            proofs/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-proofs-root-keys-parallel-${{ hashFiles('proofs/*.lock') }}
      - name: Derive the public root key (release, ignored test)
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --release --locked --features parallel --manifest-path proofs/Cargo.toml --test production_root_keys -- --ignored --nocapture --exact derive_production_public_root_key

  # Checks, on every pull request and push, that the two jobs above still
  # exist and run every ignored test of proofs/tests/production_root_keys.rs
  # after merge.
  production-root-keys-job:
    name: production-root-keys-job
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: scripts/check-production-root-keys-job.sh

  rust-client:
    name: rust-client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: 1.99.1
      CRATE: client
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            client/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-client-${{ hashFiles('client/Cargo.lock') }}
      - name: Test (release) and check wasm32-unknown-unknown
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: scripts/ci-gate.sh "rust-$CRATE"

  # Vanish, a partial Summon and a Claim with the real prover against a
  # release geth of ghost-node at the commit in webapp/test/e2e/NODE_COMMIT.
  # The geth binary is cached by that commit and the Go version, so the node
  # is rebuilt only when the pin moves. Go is the version in ghost-node's
  # go.mod, installed with the setup-go commit ghost-node's own CI pins.
  webapp-real-node:
    name: webapp-real-node
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_TOOLCHAIN: 1.99.1
      GO_VERSION: 1.26.9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore the ghost-node geth
        id: geth-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/ghost-node/build/bin/geth
          key: ghost-node-geth-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('webapp/test/e2e/NODE_COMMIT') }}
      - name: Install Go
        if: steps.geth-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build the ghost-node geth
        if: steps.geth-cache.outputs.cache-hit != 'true'
        env:
          GHOST_NODE_DIR: ${{ runner.temp }}/ghost-node
        run: |
          go version
          webapp/scripts/build-node.sh
      # Saved right after the build, so a failing test does not throw the
      # build away and make the next run rebuild the node.
      - name: Save the ghost-node geth
        if: steps.geth-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/ghost-node/build/bin/geth
          key: ${{ steps.geth-cache.outputs.cache-primary-key }}
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            webapp/wasm/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-webapp-${{ hashFiles('webapp/wasm/Cargo.lock') }}
      - name: Build the web app
        run: webapp/build.sh
      # Without a node the test prints SKIP and exits 0, so a passing exit
      # code alone does not show that it ran. A missing or non-executable
      # geth, or SKIP anywhere in the output, fails the step.
      - name: Real-node test (Vanish, Summon, Claim)
        shell: bash
        env:
          GHOST_NODE_GETH: ${{ runner.temp }}/ghost-node/build/bin/geth
          TEST_LOG: ${{ runner.temp }}/real-node.log
        run: |
          set -euo pipefail
          if [ -z "$GHOST_NODE_GETH" ] || [ ! -f "$GHOST_NODE_GETH" ] || [ ! -x "$GHOST_NODE_GETH" ]; then
            echo "GHOST_NODE_GETH ($GHOST_NODE_GETH) is not an executable file" >&2
            exit 1
          fi
          "$GHOST_NODE_GETH" version
          node --version
          node --test --test-timeout=3600000 webapp/test/e2e/real-node.test.mjs 2>&1 | tee "$TEST_LOG"
          if grep -q SKIP "$TEST_LOG"; then
            echo "the real-node test skipped instead of running" >&2
            exit 1
          fi
