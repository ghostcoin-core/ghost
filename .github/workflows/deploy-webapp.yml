name: Deploy web app

# Builds the web app with webapp/build.sh and deploys webapp/dist to Vercel
# as a prebuilt static site. It runs after a merge to main (or by hand),
# never on a proposed change, so a failed deploy cannot block a merge. It
# also runs every two hours to serve a fresh pin of the public test network
# (pin.json, webapp/scripts/make-pin.mjs): the chain grows about 240 blocks
# in two hours, so a new visitor's page seal-checks a few hundred headers at
# most instead of every header since the pin in src/header.mjs.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer run waits instead of cancelling one that is
# halfway through uploading.
concurrency:
  group: deploy-webapp
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-webapp
    # GitHub-hosted, like the jobs in ci.yml: this repository is public.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The toolchain webapp/build.sh names.
      RUST_TOOLCHAIN: 1.99.1
      # The Vercel CLI, pinned to an exact version.
      VERCEL_CLI_VERSION: 65.1.0
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      # The pin 32 blocks below a public test node's tip, walked from genesis
      # and agreed by the other public node. Fails the run rather than
      # deploying a stale pin.
      - name: Take the pin of the public test network
        run: node webapp/scripts/make-pin.mjs --out "$RUNNER_TEMP/pin.json" && cat "$RUNNER_TEMP/pin.json"
      - name: Build the web app
        run: GHOST_PIN_FILE="$RUNNER_TEMP/pin.json" webapp/build.sh
      # The Build Output API layout: the files build.sh made, unchanged, as
      # the static site, and webapp/vercel/config.json for the headers.
      - name: Lay out the prebuilt site
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -R webapp/dist/. .vercel/output/static/
          cp webapp/vercel/config.json .vercel/output/config.json
          (cd .vercel/output/static && sha256sum -c SHA256SUMS)
      - name: Install the Vercel CLI
        run: |
          npm install --global --no-fund --no-audit "vercel@$VERCEL_CLI_VERSION"
          vercel --version
      # Runs queue in the concurrency group, so an older commit's run can
      # reach this point after a newer one has already deployed. Deploy only
      # the commit that is main's head now; any other run skips the deploy and
      # the live-site check and stays green. A run started by hand on main is
      # current while main has not moved past it, and so is a scheduled run (it
      # runs on the head of main); a manual run that waited
      # behind a newer merge skips like any other. The repository is public,
      # so ls-remote needs no credentials; if it fails, the job fails instead
      # of deploying.
      - name: Skip if not the head of main
        id: head
        run: |
          set -euo pipefail
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "could not read the head of main" >&2; exit 1; }
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::$GITHUB_SHA is not the head of main ($head); a newer run deploys that."
          fi
      - name: Deploy to production
        if: steps.head.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
      # The live site, fetched the way a browser would: every file in
      # SHA256SUMS, the page at /, and every module the page and its modules
      # load. A missing file fails the job instead of leaving a dead page
      # behind a green run. curl retries while the CDN catches up.
      - name: Check the live site
        if: steps.head.outputs.current == 'true'
        env:
          SITE: https://ghost-webapp-alpha.vercel.app
        run: |
          set -euo pipefail
          live="$(mktemp -d)"
          fetch() {
            curl -q -fsS --proto '=https' --retry 6 --retry-delay 10 --retry-all-errors \
              --max-time 60 -o "$2" "$SITE/$1"
            echo "200 /$1"
          }
          safe() { [[ "$1" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]*$ && "$1" != *..* ]]; }
          fetch "" "$live/index"
          count=0
          while read -r sum path; do
            [ -n "$path" ] || continue
            safe "$path" || { echo "unexpected path in SHA256SUMS: $path" >&2; exit 1; }
            mkdir -p "$live/files/$(dirname "$path")"
            fetch "$path" "$live/files/$path"
            count=$((count + 1))
          done < webapp/dist/SHA256SUMS
          [ "$count" -gt 0 ] || { echo "SHA256SUMS lists no files" >&2; exit 1; }
          # The modules the page at / loads, and the ./x.mjs modules each
          # served src/*.mjs file imports or starts as a worker.
          {
            grep -oE 'src="(\./)?src/[A-Za-z0-9_.-]+\.mjs"' "$live/index" \
              | sed -E 's/^src="(\.\/)?//; s/"$//' || true
            for module in "$live"/files/src/*.mjs; do
              grep -oE "[\"']\./[A-Za-z0-9_.-]+\.mjs[\"']" "$module" \
                | sed -E "s/^[\"']\.\//src\//; s/[\"']$//" || true
            done
          } | LC_ALL=C sort -u > "$live/imports"
          [ -s "$live/imports" ] || { echo "found no module imports to check" >&2; exit 1; }
          while read -r path; do
            safe "$path" || { echo "unexpected import: $path" >&2; exit 1; }
            fetch "$path" /dev/null
          done < "$live/imports"
          echo "checked $count files and $(wc -l < "$live/imports") imports on $SITE"
